[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ichnos"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    # --- SCIENTIFIC CORE ---
    "numpy>=1.26,<2.0",
    "pandas>=2.2,<3.0",
    "astropy>=6,<7",

    # --- VISUALIZATION (CRITICO) ---
    "bokeh>=2.4,<3.0",
    "tornado>=6.4,<7",
    "xyzservices>=2025",

    # --- WEB STACK ---
    "Flask>=2.2,<3.0",
    "Flask-SocketIO>=5.3,<6",
    "watchdog==2.1.0",
    "eventlet==0.41.0",

    # --- UTILITIES ---
    "PyYAML>=6",
]


[project.scripts]
ichnos = "ichnos.app:main"

[tool.setuptools]
packages = ["ichnos"]
include-package-data = true